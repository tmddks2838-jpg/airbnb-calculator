<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>에어비앤비 수익성 분석기</title>
  <style>
    :root {
      --red:        #FF385C;
      --red-dark:   #D90B3A;
      --red-bg:     #FFF0F3;
      --green:      #00A699;
      --green-bg:   #E6F6F5;
      --orange:     #FC642D;
      --orange-bg:  #FFF0EA;
      --gray-50:    #F7F7F7;
      --gray-100:   #EBEBEB;
      --gray-400:   #B0B0B0;
      --gray-600:   #717171;
      --gray-900:   #222222;
      --radius:     14px;
      --shadow:     0 1px 6px rgba(0,0,0,.09);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid var(--gray-100);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 22px; color: var(--red); font-weight: 800; letter-spacing: -1px; }
    header h1 { font-size: 16px; font-weight: 700; }
    header small { font-size: 12px; color: var(--gray-600); margin-left: auto; }

    /* ── Layout ── */
    .container { max-width: 860px; margin: 0 auto; padding: 20px 14px 60px; }

    /* ── Mode tabs ── */
    .tabs {
      display: flex;
      background: #fff;
      border-radius: 50px;
      padding: 5px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }
    .tab {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: 50px;
      padding: 11px 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-600);
      transition: all .2s;
      line-height: 1.3;
    }
    .tab.active { background: var(--red); color: #fff; }
    .tab .sub { font-size: 11px; font-weight: 400; opacity: .85; display: block; }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .card-head {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .card-head .ico {
      width: 26px; height: 26px;
      background: var(--red-bg);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    /* ── Grid ── */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .full { grid-column: 1 / -1; }

    /* ── Field ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap input[type="number"] {
      width: 100%;
      padding: 10px 38px 10px 11px;
      border: 1.5px solid var(--gray-100);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-900);
      outline: none;
      transition: border-color .18s;
      -moz-appearance: textfield;
    }
    .input-wrap input[type="number"]::-webkit-inner-spin-button,
    .input-wrap input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .input-wrap input[type="number"]:focus { border-color: var(--red); }
    .unit {
      position: absolute; right: 10px;
      font-size: 12px; color: var(--gray-400);
      pointer-events: none;
    }

    /* ── Slider field ── */
    .slider-field { display: flex; flex-direction: column; gap: 5px; }
    .slider-field label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    input[type="range"] {
      flex: 1; -webkit-appearance: none;
      height: 4px; border-radius: 2px;
      background: var(--gray-100); outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--red); cursor: pointer;
      box-shadow: 0 1px 4px rgba(255,56,92,.35);
    }
    .sval {
      min-width: 52px; text-align: right;
      font-size: 14px; font-weight: 700; color: var(--red);
    }

    /* ── Presets ── */
    .presets { display: flex; gap: 7px; flex-wrap: wrap; }
    .preset {
      padding: 6px 13px;
      border: 1.5px solid var(--gray-100);
      border-radius: 20px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; background: #fff; color: var(--gray-600);
      transition: all .18s;
    }
    .preset:hover { border-color: var(--red); color: var(--red); }

    /* ── Result card ── */
    .result-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .result-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; }

    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--gray-50);
      font-size: 13.5px;
    }
    .row:last-child { border-bottom: none; }
    .row .lbl { color: var(--gray-600); }
    .row .val { font-weight: 700; }
    .row .val.plus { color: var(--green); }
    .row .val.minus { color: var(--orange); }

    hr.div { border: none; border-top: 1px solid var(--gray-100); margin: 8px 0; }

    /* ── Big result box ── */
    .big-result {
      border-radius: 12px;
      padding: 18px;
      margin-top: 16px;
      text-align: center;
    }
    .big-result.profit { background: var(--green-bg); }
    .big-result.loss   { background: #FDECEA; }
    .big-result .lbl2  { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .big-result .amount { font-size: 30px; font-weight: 800; line-height: 1; }
    .big-result .sub   { font-size: 12px; margin-top: 6px; opacity: .8; }
    .big-result.profit .lbl2,
    .big-result.profit .amount,
    .big-result.profit .sub { color: var(--green); }
    .big-result.loss .lbl2,
    .big-result.loss .amount,
    .big-result.loss .sub { color: #C0392B; }

    /* ── Occupancy bar ── */
    .occ-section { margin-top: 18px; }
    .occ-head {
      display: flex; justify-content: space-between;
      font-size: 12.5px; color: var(--gray-600); margin-bottom: 7px;
    }
    .occ-head strong { color: var(--gray-900); font-weight: 700; }
    .bar { height: 8px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }

    /* ── Badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700; margin-top: 10px;
    }
    .badge.ok   { background: var(--green-bg); color: var(--green); }
    .badge.warn { background: var(--orange-bg); color: var(--orange); }
    .badge.bad  { background: #FDECEA; color: #C0392B; }

    /* ── Tips ── */
    .tip-box {
      background: #FFFBF0;
      border-left: 3px solid #F6C343;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: #6B5A00;
      margin-top: 14px;
      line-height: 1.6;
    }
    .tip-box strong { font-weight: 700; }

    /* ── Reverse highlight ── */
    .req-box {
      background: var(--red-bg);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 16px;
    }
    .req-box .lbl2 { font-size: 12px; font-weight: 600; color: var(--red); margin-bottom: 4px; }
    .req-box .amount { font-size: 28px; font-weight: 800; color: var(--red); line-height: 1; }
    .req-box .sub { font-size: 12px; color: var(--red); margin-top: 6px; opacity: .75; }

    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: 1; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">airbnb</span>
  <h1>수익성 분석기</h1>
  <small>세금 제외 기준</small>
</header>

<div class="container">

  <!-- Mode tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-fwd" onclick="switchMode('fwd')">
      순방향 계산
      <span class="sub">매출 → 순이익</span>
    </button>
    <button class="tab" id="tab-rev" onclick="switchMode('rev')">
      역방향 계산
      <span class="sub">목표 순이익 → 필요 매출</span>
    </button>
  </div>

  <!-- ════════════════ FORWARD MODE ════════════════ -->
  <div id="mode-fwd">

    <!-- Presets -->
    <div class="card">
      <div class="card-head"><span class="ico">⚡</span> 예시 불러오기</div>
      <div class="presets">
        <button class="preset" onclick="loadPreset('a')">원룸 (본문 예시)</button>
        <button class="preset" onclick="loadPreset('b')">방 2개 빌라</button>
        <button class="preset" onclick="loadPreset('c')">방 3개 충정로형</button>
        <button class="preset" onclick="loadPreset('d')">충정로 46길</button>
      </div>
    </div>

    <!-- 임차 -->
    <div class="card">
      <div class="card-head"><span class="ico">🔑</span> 임차 조건</div>
      <div class="grid">
        <div class="field">
          <label>보증금</label>
          <div class="input-wrap">
            <input type="number" id="f_dep" value="1000" oninput="calc()">
            <span class="unit">만원</span>
          </div>
        </div>
        <div class="field">
          <label>월 임차료 (월세)</label>
          <div class="input-wrap">
            <input type="number" id="f_rent" value="55" oninput="calc()">
            <span class="unit">만원</span>
          </div>
        </div>
        <div class="field">
          <label>관리비 + 인터넷</label>
          <div class="input-wrap">
            <input type="number" id="f_mgmt" value="12" oninput="calc()">
            <span class="unit">만원</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 가격 -->
    <div class="card">
      <div class="card-head"><span class="ico">💰</span> 1박 가격</div>
      <div class="grid">
        <div class="field">
          <label>평일 (월~목)</label>
          <div class="input-wrap">
            <input type="number" id="f_wdp" value="80000" oninput="calc()">
            <span class="unit">원</span>
          </div>
        </div>
        <div class="field">
          <label>주말 (금·토)</label>
          <div class="input-wrap">
            <input type="number" id="f_wep" value="100000" oninput="calc()">
            <span class="unit">원</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 예약 -->
    <div class="card">
      <div class="card-head"><span class="ico">📅</span> 월 예약 현황</div>
      <div class="grid">
        <div class="slider-field">
          <label>평일 예약 일수 <span style="color:var(--gray-400);font-weight:400">(최대 22일)</span></label>
          <div class="slider-row">
            <input type="range" id="f_wdn" min="0" max="22" value="10"
              oninput="sv('f_wdn','f_wdn_v');calc()">
            <span class="sval"><span id="f_wdn_v">10</span>일</span>
          </div>
        </div>
        <div class="slider-field">
          <label>주말 예약 일수 <span style="color:var(--gray-400);font-weight:400">(최대 8일)</span></label>
          <div class="slider-row">
            <input type="range" id="f_wen" min="0" max="8" value="6"
              oninput="sv('f_wen','f_wen_v');calc()">
            <span class="sval"><span id="f_wen_v">6</span>일</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 청소 -->
    <div class="card">
      <div class="card-head"><span class="ico">🧹</span> 청소 비용</div>
      <div class="grid">
        <div class="field">
          <label>청소비 / 1회</label>
          <div class="input-wrap">
            <input type="number" id="f_cc" value="18000" oninput="calc()">
            <span class="unit">원</span>
          </div>
        </div>
        <div class="field">
          <label>월 청소 횟수</label>
          <div class="input-wrap">
            <input type="number" id="f_cn" value="16" oninput="calc()">
            <span class="unit">회</span>
          </div>
        </div>
      </div>
    </div>

    <div class="result-card" id="f_result"></div>
  </div>

  <!-- ════════════════ REVERSE MODE ════════════════ -->
  <div id="mode-rev" style="display:none">

    <!-- 목표 -->
    <div class="card">
      <div class="card-head"><span class="ico">🎯</span> 월 목표 순이익</div>
      <div class="slider-field">
        <div class="slider-row">
          <input type="range" id="r_tgt" min="50" max="500" value="150" step="10"
            oninput="sv('r_tgt','r_tgt_v');calcRev()">
          <span class="sval"><span id="r_tgt_v">150</span>만원</span>
        </div>
      </div>
    </div>

    <!-- 지출 -->
    <div class="card">
      <div class="card-head"><span class="ico">🔑</span> 월 고정 지출</div>
      <div class="grid">
        <div class="field">
          <label>보증금</label>
          <div class="input-wrap">
            <input type="number" id="r_dep" value="1000" oninput="calcRev()">
            <span class="unit">만원</span>
          </div>
        </div>
        <div class="field">
          <label>월 임차료 (월세)</label>
          <div class="input-wrap">
            <input type="number" id="r_rent" value="55" oninput="calcRev()">
            <span class="unit">만원</span>
          </div>
        </div>
        <div class="field">
          <label>관리비 + 인터넷</label>
          <div class="input-wrap">
            <input type="number" id="r_mgmt" value="12" oninput="calcRev()">
            <span class="unit">만원</span>
          </div>
        </div>
        <div class="field">
          <label>월 청소비 합계</label>
          <div class="input-wrap">
            <input type="number" id="r_cln" value="29" oninput="calcRev()">
            <span class="unit">만원</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 가격 (역산용) -->
    <div class="card">
      <div class="card-head"><span class="ico">💰</span> 1박 가격 <span style="font-size:12px;font-weight:400;color:var(--gray-600)">(점유율 역산에 사용)</span></div>
      <div class="grid">
        <div class="field">
          <label>평일</label>
          <div class="input-wrap">
            <input type="number" id="r_wdp" value="80000" oninput="calcRev()">
            <span class="unit">원</span>
          </div>
        </div>
        <div class="field">
          <label>주말</label>
          <div class="input-wrap">
            <input type="number" id="r_wep" value="100000" oninput="calcRev()">
            <span class="unit">원</span>
          </div>
        </div>
      </div>
    </div>

    <div class="result-card" id="r_result"></div>
  </div>

</div>

<script>
// ─── helpers ───────────────────────────────────────────
const $ = id => document.getElementById(id);
const n = id => +$(id).value || 0;

function sv(sliderId, labelId) {
  $(labelId).textContent = $(sliderId).value;
}

function won(v, digits = 1) {
  const abs = Math.abs(v);
  if (abs === 0) return '0원';
  if (abs >= 100000000) return (v / 100000000).toFixed(digits).replace(/\.0$/,'') + '억원';
  if (abs >= 10000)     return (v / 10000).toFixed(digits).replace(/\.0$/,'') + '만원';
  return v.toLocaleString('ko-KR') + '원';
}
function man(v, d = 1) {
  return v.toFixed(d).replace(/\.0$/, '') + '만원';
}

function badge(occ) {
  if (occ <= 50)  return ['ok',   '달성 매우 용이 (점유율 50% 이하)'];
  if (occ <= 65)  return ['ok',   '현실적으로 가능 (점유율 65% 이하)'];
  if (occ <= 80)  return ['warn', '적극적 마케팅 필요 (점유율 80% 이하)'];
  if (occ <= 100) return ['bad',  '달성 어려움 — 가격 조정 권장'];
  return ['bad', '현재 가격으로 달성 불가'];
}

function barColor(occ) {
  if (occ <= 65) return 'var(--green)';
  if (occ <= 80) return 'var(--orange)';
  return '#E74C3C';
}

// ─── mode switch ───────────────────────────────────────
function switchMode(m) {
  $('mode-fwd').style.display = m === 'fwd' ? '' : 'none';
  $('mode-rev').style.display = m === 'rev' ? '' : 'none';
  $('tab-fwd').classList.toggle('active', m === 'fwd');
  $('tab-rev').classList.toggle('active', m === 'rev');
  m === 'fwd' ? calc() : calcRev();
}

// ─── FORWARD ───────────────────────────────────────────
function calc() {
  const dep    = n('f_dep');
  const rent   = n('f_rent');
  const mgmt   = n('f_mgmt');
  const wdp    = n('f_wdp');
  const wep    = n('f_wep');
  const wdn    = n('f_wdn');
  const wen    = n('f_wen');
  const cc     = n('f_cc');
  const cn     = n('f_cn');

  const wdRev = wdp * wdn;
  const weRev = wep * wen;
  const revenue = wdRev + weRev;

  const cleanTotal = cc * cn;
  const expenses   = (rent + mgmt) * 10000 + cleanTotal;
  const net        = revenue - expenses;

  const totalNights = wdn + wen;
  const occ = totalNights / 30 * 100;
  const annualNet = net * 12;
  const roi = dep > 0 ? (annualNet / (dep * 10000) * 100).toFixed(1) : null;

  const isProfit = net >= 0;
  const [bc, bl] = badge(occ);

  $('f_result').innerHTML = `
    <div class="result-title">📊 수익성 분석 결과</div>

    <div class="row"><span class="lbl">평일 매출 (${wdn}박 × ${won(wdp)})</span><span class="val plus">+${won(wdRev)}</span></div>
    <div class="row"><span class="lbl">주말 매출 (${wen}박 × ${won(wep)})</span><span class="val plus">+${won(weRev)}</span></div>
    <div class="row"><span class="lbl"><strong>월 매출 합계</strong></span><span class="val">${won(revenue)}</span></div>
    <hr class="div">
    <div class="row"><span class="lbl">월세</span><span class="val minus">−${man(rent)}</span></div>
    <div class="row"><span class="lbl">관리비 + 인터넷</span><span class="val minus">−${man(mgmt)}</span></div>
    <div class="row"><span class="lbl">청소비 (${cn}회 × ${won(cc)})</span><span class="val minus">−${won(cleanTotal)}</span></div>
    <div class="row"><span class="lbl"><strong>총 지출</strong></span><span class="val">−${won(expenses)}</span></div>

    <div class="big-result ${isProfit ? 'profit' : 'loss'}">
      <div class="lbl2">월 순이익</div>
      <div class="amount">${won(Math.abs(net))}${isProfit ? '' : ' 손실'}</div>
      ${roi ? `<div class="sub">보증금 연 수익률 ${roi}%&nbsp;&nbsp;|&nbsp;&nbsp;연 순이익 ${won(annualNet)}</div>` : ''}
    </div>

    <div class="occ-section">
      <div class="occ-head">
        <span>월 점유율</span>
        <strong>${totalNights}박 / 30일 = ${occ.toFixed(1)}%</strong>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${Math.min(occ,100)}%;background:${barColor(occ)}"></div></div>
      <div style="text-align:center"><span class="badge ${bc}">${bl}</span></div>
    </div>

    <div class="tip-box">
      <strong>💡 검증 팁</strong><br>
      에어비앤비 게스트 모드로 접속 → 해당 매물과 비슷한 주변 숙소 검색 →
      날짜 필터를 3월~8월 전체로 설정해 예약 현황 확인.
      인테리어(화이트·우드·그린)와 가격대가 비슷한 매물의 점유율을 참고해 위 슬라이더를 조정하세요.
    </div>
  `;
}

// ─── REVERSE ───────────────────────────────────────────
function calcRev() {
  const tgt  = n('r_tgt');    // 만원
  const dep  = n('r_dep');
  const rent = n('r_rent');
  const mgmt = n('r_mgmt');
  const cln  = n('r_cln');
  const wdp  = n('r_wdp');
  const wep  = n('r_wep');

  const expenseMan    = rent + mgmt + cln;
  const reqRevMan     = tgt + expenseMan;
  const reqDailyMan   = reqRevMan / 30;

  // reverse-solve occupancy: fill weekends first (8 days), then weekdays (22 days)
  let remaining = reqRevMan * 10000;
  const maxWeekendRev = wep * 8;
  const weekendUsed = Math.min(maxWeekendRev, remaining);
  const needWeekend = wep > 0 ? Math.ceil(weekendUsed / wep) : 0;
  remaining -= needWeekend * wep;

  const needWeekday = (wdp > 0 && remaining > 0) ? Math.min(22, Math.ceil(remaining / wdp)) : 0;
  const totalNeed = needWeekend + needWeekday;
  const occ = Math.min(totalNeed / 30 * 100, 999);

  const annualNet = tgt * 12;
  const roi = dep > 0 ? (annualNet / dep * 100).toFixed(1) : null;

  const [bc, bl] = badge(occ);
  const occDisplay = occ > 100 ? `${occ.toFixed(0)}% — 달성 불가` : `${occ.toFixed(1)}%`;

  $('r_result').innerHTML = `
    <div class="result-title">📊 역방향 분석 결과</div>

    <div class="req-box">
      <div class="lbl2">필요 월 매출</div>
      <div class="amount">${man(reqRevMan)}</div>
      <div class="sub">하루 평균 ${reqDailyMan.toFixed(1)}만원 필요</div>
    </div>

    <div class="row"><span class="lbl">목표 순이익</span><span class="val plus">+${man(tgt)}</span></div>
    <div class="row"><span class="lbl">월세</span><span class="val minus">+${man(rent)}</span></div>
    <div class="row"><span class="lbl">관리비 + 인터넷</span><span class="val minus">+${man(mgmt)}</span></div>
    <div class="row"><span class="lbl">청소비</span><span class="val minus">+${man(cln)}</span></div>
    <hr class="div">
    <div class="row"><span class="lbl"><strong>= 필요 월 매출</strong></span><span class="val">${man(reqRevMan)}</span></div>
    <hr class="div">
    <div class="row"><span class="lbl">필요 주말 예약 (최대 8일)</span><span class="val">${needWeekend}박</span></div>
    <div class="row"><span class="lbl">필요 평일 예약 (최대 22일)</span><span class="val">${needWeekday}박</span></div>
    ${roi ? `<div class="row"><span class="lbl">보증금 연 수익률</span><span class="val">${roi}% (연 ${man(annualNet)})</span></div>` : ''}

    <div class="occ-section">
      <div class="occ-head">
        <span>필요 점유율</span>
        <strong>${totalNeed}박 / 30일 = ${occDisplay}</strong>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${Math.min(occ,100)}%;background:${barColor(occ)}"></div></div>
      <div style="text-align:center"><span class="badge ${bc}">${bl}</span></div>
    </div>

    <div class="tip-box">
      <strong>💡 역방향 활용법</strong><br>
      ① 목표 순이익 슬라이더를 조정 → 필요 점유율 확인<br>
      ② 에어비앤비에서 주변 유사 매물 점유율 실측<br>
      ③ 실측 점유율 ≥ 필요 점유율이면 <strong>투자 진입 검토</strong>, 미달이면 가격 조정 또는 매물 재검토
    </div>
  `;
}

// ─── PRESETS ───────────────────────────────────────────
const PRESETS = {
  a: { dep:1000, rent:55,  mgmt:12, wdp:80000,  wep:100000, wdn:10, wen:6, cc:18000, cn:16 },
  b: { dep:2000, rent:80,  mgmt:15, wdp:120000, wep:150000, wdn:12, wen:7, cc:25000, cn:19 },
  c: { dep:1000, rent:110, mgmt:20, wdp:140000, wep:180000, wdn:14, wen:8, cc:35000, cn:22 },
  d: { dep:1000, rent:110, mgmt:15, wdp:140000, wep:180000, wdn:14, wen:8, cc:40000, cn:22 },
};

function loadPreset(key) {
  const p = PRESETS[key];
  $('f_dep').value  = p.dep;
  $('f_rent').value = p.rent;
  $('f_mgmt').value = p.mgmt;
  $('f_wdp').value  = p.wdp;
  $('f_wep').value  = p.wep;
  $('f_wdn').value  = p.wdn;  $('f_wdn_v').textContent = p.wdn;
  $('f_wen').value  = p.wen;  $('f_wen_v').textContent = p.wen;
  $('f_cc').value   = p.cc;
  $('f_cn').value   = p.cn;
  calc();
}

// ─── init ──────────────────────────────────────────────
calc();
</script>
</body>
</html>
